<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coding Challenge Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; background-color: #f5f7fb; color: #333; }
        .wrapper { max-width: 800px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { color: #1e293b; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; margin-top: 0; }
        h3 { color: #475569; margin-bottom: 8px; }
        .section { margin-bottom: 25px; }
        p, pre { line-height: 1.6; color: #334155; }
        pre, .code-block { background: #1e1e1e; color: #d4d4d4; padding: 15px; border-radius: 8px; overflow-x: auto; font-family: 'Consolas', 'Courier New', monospace; font-size: 0.95rem; white-space: pre-wrap; }
        .result-card { background: #f0fdf4; border-left: 4px solid #16a34a; padding: 15px; border-radius: 4px; margin-top: 10px; }
        .matrix-display { font-family: monospace; background: #f8fafc; border: 1px solid #e2e8f0; padding: 10px; border-radius: 6px; display: inline-block; margin-top: 5px; font-size: 1.1rem; }
        .file-selector { margin-bottom: 20px; display: flex; gap: 10px; align-items: center; }
        select { padding: 8px 12px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 1rem; }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="file-selector">
            <label for="script-switcher"><strong>Select Challenge File:</strong></label>
            <select id="script-switcher">
                <option value="./Sep - 2026/6_Sep_2026.js">6_Sep_2026.js</option>
                </select>
        </div>

        <h1 id="challenge-title">Loading Challenge...</h1>
        
        <div class="section">
            <h3>Problem Statement</h3>
            <p id="challenge-statement"></p>
        </div>

        <div class="section">
            <h3>Analogy & Logic</h3>
            <pre id="challenge-analogy"></pre>
        </div>

        <div class="section">
            <h3>Execution & Output</h3>
            <div id="challenge-outputs"></div>
        </div>
    </div>

    <script>
        function loadChallenge(scriptSrc) {
            const existingScript = document.getElementById('active-challenge-script');
            if (existingScript) {
                existingScript.remove();
            }

            const script = document.createElement('script');
            script.id = 'active-challenge-script';
            script.src = scriptSrc;
            
            script.onload = () => {
                if (typeof challengeData !== 'undefined' && typeof runChallenge === 'function') {
                    document.getElementById('challenge-title').textContent = challengeData.title;
                    document.getElementById('challenge-statement').textContent = challengeData.statement;
                    document.getElementById('challenge-analogy').textContent = challengeData.analogy;
                    
                    const outputContainer = document.getElementById('challenge-outputs');
                    outputContainer.innerHTML = '';
                    
                    runChallenge(challengeData, outputContainer);
                } else {
                    console.error("The loaded script is missing 'challengeData' or 'runChallenge'.");
                }
            };
            
            script.onerror = () => {
                document.getElementById('challenge-title').textContent = "Error Loading File";
                document.getElementById('challenge-statement').textContent = `Could not load script from: ${scriptSrc}. Check file path.`;
            };

            document.body.appendChild(script);
        }

        // Load the initial default file on startup
        const switcher = document.getElementById('script-switcher');
        loadChallenge(switcher.value);

        // Listen for user changes in the dropdown
        switcher.addEventListener('change', (e) => {
            loadChallenge(e.target.value);
        });
    </script>
</body>
</html>
